<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tahatech Stream</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1 class="logo">Tahatech Stream</h1>
        <div class="search-container">
            <input type="text" id="searchInput" placeholder="Rechercher un film ou une série...">
            <button id="searchBtn">Rechercher</button>
        </div>
    </header>
    
    <main>
        <h2 id="gridTitle">Tendances de la semaine (VF / VOSTFR)</h2>
        <div id="mediaGrid" class="media-grid"></div>
    </main>
    
    <div id="playerModal" class="modal">
        <div class="modal-content">
            <span id="closeModal" class="close">&times;</span>
            <h2 id="playerTitle">Titre de la vidéo</h2>
            
            <!-- Sélecteur de toutes les sources web disponibles -->
            <div id="sourceSelector" class="source-tabs" style="display: none;"></div>

            <!-- Sélecteur de saisons et épisodes -->
            <div id="seasonSelector" class="season-selector" style="display: none;">
                <select id="seasonSelect"></select>
                <select id="episodeSelect"></select>
            </div>

            <p id="loaderMessage">Chargement du lecteur...</p>
            
            <div id="xrayPanel" class="xray-panel">
                <h3>Casting (X-Ray)</h3>
                <div id="xrayCast" class="xray-cast"></div>
            </div>
        </div>
    </div>
    
    <script src="app.js"></script>
</body>
</html>
